plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.subcontracker.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.subcontracker.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        shared {
            storeFile rootProject.file('subcontracker.keystore')
            storePassword 'subcontracker1'
            keyAlias 'subcontracker'
            keyPassword 'subcontracker1'
        }
    }

    buildTypes {
        // Both build types use the committed keystore so the APK's SHA-1 stays
        // stable across machines/CI — required for Google Sign-In OAuth setup.
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Google Sign-In (Drive account) + token retrieval for Drive REST calls
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
