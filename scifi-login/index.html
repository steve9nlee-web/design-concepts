<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Access Node</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
  /* ── Quantum Access Node — single-theme sci-fi HUD ─────────────────── */
  :root {
    --ground:   #04090c;
    --panel:    rgba(10, 20, 26, 0.88);
    --line:     rgba(59, 224, 205, 0.22);
    --teal:     #3be0cd;
    --teal-dim: rgba(59, 224, 205, 0.55);
    --magenta:  #e14b6a;
    --dim:      #7d9aa3;
    --bright:   #eafffb;
    --mono: "Share Tech Mono", "Courier New", ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--ground);
    color: var(--bright);
    font-family: var(--mono);
    overflow: hidden;
  }

  #starfield {
    position: fixed;
    inset: 0;
    display: block;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }

  /* ── Orbital arcs around the card ──────────────────────────────────── */
  .orbit-wrap {
    position: relative;
    width: min(92vw, 560px);
    height: min(92vw, 560px);
    display: grid;
    place-items: center;
  }

  .orbit {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .orbit-a {
    inset: 0;
    border: 1px solid transparent;
    border-top-color: var(--teal-dim);
    border-right-color: rgba(59, 224, 205, 0.15);
    animation: spin 14s linear infinite;
  }

  .orbit-b {
    inset: 7%;
    border: 1px solid transparent;
    border-bottom-color: rgba(225, 75, 106, 0.5);
    animation: spin 22s linear infinite reverse;
  }

  .orbit-c {
    inset: 14%;
    border: 1px dashed rgba(59, 224, 205, 0.10);
    animation: spin 60s linear infinite;
  }

  .orbit-a::after, .orbit-b::after {
    content: "";
    position: absolute;
    top: -3px;
    left: 50%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
  }

  .orbit-b::after {
    background: var(--magenta);
    box-shadow: 0 0 8px var(--magenta);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Access card ───────────────────────────────────────────────────── */
  .card {
    position: relative;
    width: min(86vw, 340px);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 28px 26px 26px;
    box-shadow:
      0 0 40px rgba(59, 224, 205, 0.06),
      0 0 120px rgba(59, 224, 205, 0.04),
      inset 0 0 30px rgba(4, 9, 12, 0.6);
    backdrop-filter: blur(3px);
    animation: card-in 0.7s ease-out both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* corner brackets */
  .card::before, .card::after,
  .card .corner::before, .card .corner::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid var(--teal);
  }
  .card::before          { top: -1px;    left: -1px;   border-right: 0; border-bottom: 0; }
  .card::after           { top: -1px;    right: -1px;  border-left: 0;  border-bottom: 0; }
  .card .corner::before  { bottom: -1px; left: -1px;   border-right: 0; border-top: 0; }
  .card .corner::after   { bottom: -1px; right: -1px;  border-left: 0;  border-top: 0; }

  .sys-label {
    color: var(--teal);
    font-size: 10px;
    letter-spacing: 0.42em;
    text-align: center;
    margin-bottom: 10px;
  }

  .card h1 {
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-align: center;
    text-shadow: 0 0 18px rgba(59, 224, 205, 0.35);
  }

  .sub-label {
    color: var(--dim);
    font-size: 9px;
    letter-spacing: 0.34em;
    text-align: center;
    margin: 8px 0 24px;
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    color: var(--teal-dim);
    font-size: 9px;
    letter-spacing: 0.3em;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: rgba(4, 9, 12, 0.85);
    border: 1px solid var(--line);
    color: var(--bright);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    padding: 10px 12px;
    caret-color: var(--teal);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input::placeholder { color: rgba(125, 154, 163, 0.4); }

  .field input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 12px rgba(59, 224, 205, 0.25);
  }

  .field input:focus-visible {
    outline: 1px solid var(--teal);
    outline-offset: 2px;
  }

  .error-line {
    color: var(--magenta);
    font-size: 10px;
    letter-spacing: 0.18em;
    min-height: 14px;
    margin-bottom: 8px;
    visibility: hidden;
  }

  .error-line.show { visibility: visible; }

  button.init {
    width: 100%;
    background: var(--teal);
    border: 0;
    color: #04211d;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.28em;
    padding: 13px 0 12px;
    cursor: pointer;
    transition: box-shadow 0.2s, background 0.2s;
  }

  button.init:hover,
  button.init:focus-visible {
    background: #55f0dd;
    box-shadow: 0 0 24px rgba(59, 224, 205, 0.45);
    outline: none;
  }

  /* ── Scanner state ─────────────────────────────────────────────────── */
  .scanner {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
  }

  .scanner.active { display: grid; }

  .rings {
    position: relative;
    width: min(88vw, 460px);
    height: min(88vw, 460px);
    display: grid;
    place-items: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(59, 224, 205, 0.12);
  }
  .ring.r1 { inset: 0;   animation: pulse 3s ease-in-out infinite; }
  .ring.r2 { inset: 12%; animation: pulse 3s ease-in-out 0.4s infinite; }
  .ring.r3 { inset: 24%; animation: pulse 3s ease-in-out 0.8s infinite; }
  .ring.r4 { inset: 36%; border-color: rgba(59, 224, 205, 0.2); }

  @keyframes pulse {
    0%, 100% { border-color: rgba(59, 224, 205, 0.08); }
    50%      { border-color: rgba(59, 224, 205, 0.30); }
  }

  .sweep {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid transparent;
    border-top-color: var(--teal);
    animation: spin 2.4s linear infinite;
  }

  .scan-core {
    position: relative;
    width: min(70vw, 300px);
    text-align: center;
  }

  .hex {
    width: 44px;
    height: 50px;
    margin: 0 auto 18px;
    background: rgba(59, 224, 205, 0.12);
    border: 1px solid var(--teal-dim);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    animation: hex-glow 1.6s ease-in-out infinite;
  }

  @keyframes hex-glow {
    0%, 100% { background: rgba(59, 224, 205, 0.08); }
    50%      { background: rgba(59, 224, 205, 0.28); }
  }

  .scan-title {
    display: inline-block;
    background: rgba(59, 224, 205, 0.14);
    border: 1px solid var(--line);
    color: var(--teal);
    font-size: 10px;
    letter-spacing: 0.3em;
    padding: 5px 14px 4px;
    margin-bottom: 12px;
  }

  .pct {
    font-size: 22px;
    letter-spacing: 0.2em;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }

  .bar {
    height: 3px;
    background: rgba(59, 224, 205, 0.12);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--teal), var(--magenta));
    transition: width 0.25s linear;
  }

  .log {
    text-align: left;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--dim);
    min-height: 70px;
  }

  .log p { margin-bottom: 5px; opacity: 0; animation: log-in 0.3s ease-out forwards; }
  .log p::before { content: "> "; color: var(--teal); }
  .log p.warn { color: var(--magenta); }

  @keyframes log-in {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Granted state ─────────────────────────────────────────────────── */
  .granted {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    text-align: center;
  }

  .granted.active { display: grid; }

  .granted-box { animation: card-in 0.6s ease-out both; }

  .granted h2 {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.34em;
    color: var(--teal);
    text-shadow: 0 0 24px rgba(59, 224, 205, 0.5);
    margin-bottom: 12px;
  }

  .granted p {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.22em;
    margin-bottom: 26px;
  }

  .granted button {
    background: none;
    border: 1px solid var(--line);
    color: var(--teal);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.26em;
    padding: 10px 22px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .granted button:hover,
  .granted button:focus-visible {
    border-color: var(--teal);
    box-shadow: 0 0 16px rgba(59, 224, 205, 0.3);
    outline: none;
  }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .orbit-a, .orbit-b, .orbit-c, .sweep { animation-duration: 200s; }
    .ring, .hex { animation: none; }
    .card, .granted-box { animation: none; }
  }
</style>
</head>
<body>

<canvas id="starfield" aria-hidden="true"></canvas>

<main class="stage" id="loginStage">
  <div class="orbit-wrap">
    <div class="orbit orbit-a"></div>
    <div class="orbit orbit-b"></div>
    <div class="orbit orbit-c"></div>

    <form class="card" id="loginForm" autocomplete="off">
      <span class="corner" aria-hidden="true"></span>
      <div class="sys-label">QUANTUM SECURITY SYSTEM</div>
      <h1>ACCESS NODE</h1>
      <div class="sub-label">AUTHENTICATION REQUIRED</div>

      <div class="field">
        <label for="identifier">IDENTIFIER</label>
        <input id="identifier" name="identifier" type="text"
               placeholder="NODE_XXXX" spellcheck="false" autocomplete="username">
      </div>

      <div class="field">
        <label for="token">SECURITY TOKEN</label>
        <input id="token" name="token" type="password"
               placeholder="••••••••••••" autocomplete="current-password">
      </div>

      <div class="error-line" id="errorLine" role="alert">CREDENTIALS REQUIRED — ALL FIELDS</div>

      <button type="submit" class="init">INITIALIZE CONNECTION</button>
    </form>
  </div>
</main>

<section class="scanner" id="scanner" aria-live="polite">
  <div class="rings">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="sweep"></div>

    <div class="scan-core">
      <div class="hex" aria-hidden="true"></div>
      <div class="scan-title">ANALYZING QUANTUM SIGNATURE</div>
      <div class="pct" id="pct">0%</div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</section>

<section class="granted" id="granted">
  <div class="granted-box">
    <h2>ACCESS GRANTED</h2>
    <p id="welcomeLine">WELCOME, OPERATOR</p>
    <button type="button" id="resetBtn">TERMINATE SESSION</button>
  </div>
</section>

<script>
  /* ── Starfield ─────────────────────────────────────────────────────── */
  const canvas = document.getElementById("starfield");
  const ctx = canvas.getContext("2d");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [];

  function seedStars() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    const count = Math.floor((innerWidth * innerHeight) / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.2,
      v: Math.random() * 0.12 + 0.02,
      tw: Math.random() * Math.PI * 2,
    }));
  }

  function drawStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      const alpha = 0.25 + 0.55 * Math.abs(Math.sin(t / 900 + s.tw));
      ctx.fillStyle = s.r > 1 ? `rgba(59,224,205,${alpha * 0.7})` : `rgba(234,255,251,${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (!reduceMotion) {
        s.y -= s.v;
        if (s.y < -2) { s.y = canvas.height + 2; s.x = Math.random() * canvas.width; }
      }
    }
    requestAnimationFrame(drawStars);
  }

  addEventListener("resize", seedStars);
  seedStars();
  requestAnimationFrame(drawStars);

  /* ── Auth flow ─────────────────────────────────────────────────────── */
  const loginStage = document.getElementById("loginStage");
  const scanner    = document.getElementById("scanner");
  const granted    = document.getElementById("granted");
  const form       = document.getElementById("loginForm");
  const errorLine  = document.getElementById("errorLine");
  const pctEl      = document.getElementById("pct");
  const barFill    = document.getElementById("barFill");
  const logEl      = document.getElementById("log");

  const LOG_STEPS = [
    [8,  "PARALLEL HANDSHAKE INITIATED"],
    [26, "ENCRYPTION LATTICE VERIFIED"],
    [47, "NODE SIGNATURE CROSS-REFERENCED"],
    [63, "ANOMALY SWEEP — CLEAR", false],
    [81, "SECURITY TOKEN DECRYPTED"],
    [96, "CHANNEL SYNCHRONIZED"],
  ];

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const id = document.getElementById("identifier").value.trim();
    const tok = document.getElementById("token").value.trim();

    if (!id || !tok) {
      errorLine.classList.add("show");
      return;
    }
    errorLine.classList.remove("show");

    /*
     * DEMO MODE: any non-empty credentials pass. To wire real auth,
     * replace runScan() with a fetch() to your backend and call
     * runScan() only while the request is in flight, showGranted()
     * on success.
     */
    runScan(id);
  });

  function runScan(id) {
    loginStage.classList.add("hidden");
    scanner.classList.add("active");
    logEl.innerHTML = "";

    let progress = 0;
    let stepIdx = 0;
    const duration = reduceMotion ? 800 : 4200;
    const start = performance.now();

    function tick(now) {
      const t = Math.min((now - start) / duration, 1);
      progress = Math.min(Math.round(t * 100), 100);
      pctEl.textContent = progress + "%";
      barFill.style.width = progress + "%";

      while (stepIdx < LOG_STEPS.length && progress >= LOG_STEPS[stepIdx][0]) {
        const p = document.createElement("p");
        p.textContent = LOG_STEPS[stepIdx][1];
        logEl.appendChild(p);
        stepIdx++;
      }

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        setTimeout(() => showGranted(id), 500);
      }
    }
    requestAnimationFrame(tick);
  }

  function showGranted(id) {
    scanner.classList.remove("active");
    granted.classList.add("active");
    document.getElementById("welcomeLine").textContent =
      "WELCOME, " + (id ? id.toUpperCase() : "OPERATOR");
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    granted.classList.remove("active");
    form.reset();
    loginStage.classList.remove("hidden");
    document.getElementById("identifier").focus();
  });
</script>

</body>
</html>
